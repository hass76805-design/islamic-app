<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <title>أنت أوفلاين — البرنامج الإسلامي الذهبي</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        background: #000000;
        color: #ffffff;
        font-family: system-ui, -apple-system, 'Cairo', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .card {
        width: 100%;
        max-width: 380px;
        border: 2px solid #c9a227;
        border-radius: 24px;
        background: #080602;
        padding: 28px 20px;
        text-align: center;
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 16px;
        border-radius: 18px;
        border: 2px solid #c9a227;
        background: rgba(201, 162, 39, 0.14);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        color: #fce38a;
      }
      p {
        margin: 12px 0 22px;
        font-size: 14px;
        line-height: 1.8;
        color: #e4e4e7;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 46px;
        border-radius: 14px;
        background: #c9a227;
        color: #000000;
        font-weight: 800;
        font-size: 14px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon">📶</div>
      <h1>أنت أوفلاين</h1>
      <p>
        لا يوجد اتصال بالإنترنت حاليًا. جميع أقسام البرنامج الإسلامي الذهبي المحفوظة (القرآن الكريم، التفسير، الأذكار، التعليم، القبلة، السبحة، والأذان) تعمل دون نت.
      </p>
      <a href="/">فتح التطبيق أوفلاين</a>
    </main>
  </body>
</html>
