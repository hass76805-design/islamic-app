<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldRichM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE38A" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9A7210" />
    </linearGradient>
    <linearGradient id="goldBrightM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF0B3" />
      <stop offset="50%" stop-color="#C9A227" />
      <stop offset="100%" stop-color="#8A640A" />
    </linearGradient>
  </defs>

  <!-- Full-bleed solid black background for maskable safe-zone cropping -->
  <rect x="0" y="0" width="512" height="512" fill="#000000" />

  <!-- Safe-zone inner circular/rounded golden frame (80% center zone) -->
  <rect x="64" y="64" width="384" height="384" rx="84" fill="#050505" stroke="url(#goldRichM)" stroke-width="8" />
  <rect x="78" y="78" width="356" height="356" rx="72" fill="none" stroke="#C9A227" stroke-opacity="0.45" stroke-width="2" />

  <g transform="translate(256, 256) scale(0.76) translate(-256, -256)">
    <g transform="translate(256, 206)" opacity="0.24" stroke="url(#goldRichM)" stroke-width="2.5" fill="none">
      <rect x="-126" y="-126" width="252" height="252" rx="18" />
      <rect x="-126" y="-126" width="252" height="252" rx="18" transform="rotate(45)" />
    </g>

    <g transform="translate(256, 108)">
      <path d="M 10,-32 A 26,26 0 1,0 10,20 A 21,21 0 1,1 10,-32 Z" fill="url(#goldRichM)" />
      <polygon points="34,-18 38,-8 48,-4 38,0 34,10 30,0 20,-4 30,-8" fill="#FCE38A" />
    </g>

    <g transform="translate(256, 232)">
      <path
        d="M -138,44 L -120,-62 Q -62,-76 0,-48 Q 62,-76 120,-62 L 138,44 Q 68,26 0,54 Q -68,26 -138,44 Z"
        fill="#080703"
        stroke="url(#goldRichM)"
        stroke-width="6.5"
        stroke-linejoin="round"
      />
      <line x1="0" y1="-48" x2="0" y2="54" stroke="url(#goldRichM)" stroke-width="5" />
      <polygon points="0,48 11,59 0,70 -11,59" fill="url(#goldRichM)" />
      <g stroke="url(#goldRichM)" stroke-width="3.2" stroke-linecap="round">
        <line x1="-88" y1="-28" x2="-22" y2="-16" />
        <line x1="-92" y1="-8" x2="-22" y2="3" />
        <line x1="-96" y1="12" x2="-24" y2="22" />
        <line x1="88" y1="-28" x2="22" y2="-16" />
        <line x1="92" y1="-8" x2="22" y2="3" />
        <line x1="96" y1="12" x2="24" y2="22" />
      </g>
    </g>

    <g transform="translate(256, 398)">
      <text
        x="0"
        y="20"
        text-anchor="middle"
        direction="rtl"
        fill="url(#goldBrightM)"
        font-family="'Amiri', 'Noto Naskh Arabic', 'Noto Kufi Arabic', serif"
        font-size="84"
        font-weight="700"
      >الذهبي</text>
    </g>
  </g>
</svg>
