    <meta property="og:title" content="البرنامج الإسلامي الذهبي" />
    <meta property="og:description" content="البرنامج الإسلامي الذهبي — تطبيق إسلامي شامل يعمل أوفلاين بالكامل بتصميم أسود وذهبي فاخر." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0f0f0f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="البرنامج الإسلامي الذهبي" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <style>
      html, body, #root {
        background-color: #000000 !important;
        color: #ffffff;
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .boot-fallback {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #000000;
        color: #fce38a;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .boot-icon {
        width: 112px;
        height: 112px;
        border-radius: 26%;
        border: 2px solid #c9a227;
        object-fit: cover;
        background: #050505;
        box-shadow: 0 0 36px rgba(201, 162, 39, 0.32);
      }
      .boot-btn {
        display: none;
        margin-top: 8px;
        padding: 12px 22px;
        border-radius: 14px;
        border: 1.5px solid #fce38a;
        background: #c9a227;
        color: #000000;
        font-weight: 800;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body class="bg-[#000000] text-white antialiased">
    <div id="root">
      <div class="boot-fallback" id="app-boot-shell">
        <div id="boot-status-text" style="font-size:13px;color:#C9A227;opacity:0.75">جاري فتح التطبيق...</div>
        <button type="button" id="boot-recover-btn" class="boot-btn">تحديث وإعادة الفتح</button>
      </div>
    </div>
    <script>
      (function () {
        var booted = false;
        window.__ALZAHABI_BOOT_OK__ = function () {
          booted = true;
        };
        function showRecover(msg) {
          if (booted) return;
          var txt = document.getElementById('boot-status-text');
          var btn = document.getElementById('boot-recover-btn');
          if (txt && msg) txt.textContent = msg;
          if (btn) btn.style.display = 'inline-block';
        }
        function resetCachesAndReload() {
          try {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              }).catch(function () {});
            }
            if ('caches' in window) {
              caches.keys().then(function (keys) {
                return Promise.all(
                  keys
                    .filter(function (k) {
                      return k.indexOf('audio') === -1 && k.indexOf('alzahabi-core-data') === -1;
                    })
                    .map(function (k) { return caches.delete(k); })
                );
              }).finally(function () {
                window.location.reload();
              });
              return;
            }
          } catch (e) {}
          window.location.reload();
        }
        var btn = document.getElementById('boot-recover-btn');
        if (btn) btn.addEventListener('click', resetCachesAndReload);
        window.addEventListener('error', function (e) {
          if (booted) return;
          var target = e && e.target;
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            try {
              if (navigator.onLine && !sessionStorage.getItem('alzahabi_boot_retry')) {
                sessionStorage.setItem('alzahabi_boot_retry', '1');
                resetCachesAndReload();
                return;
              }
            } catch (err) {}
            showRecover('اضغط لإعادة تنشيط الملفات وفتح التطبيق');
          }
        }, true);
        setTimeout(function () {
          if (!booted) {
            showRecover('استغرق التشغيل وقتاً إضافياً — اضغط للتنشيط');
          }
        }, 6500);
      })();
    </script>
    <script src="/adhan.js" defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
